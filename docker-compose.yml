services:
  # API Gateway - Single entry point for all model services
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.models
      target: prod
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - AFFINITY_API_URL=http://gateway:8000/affinity_predictor
    command: python -m uvicorn gateway:app --host 0.0.0.0 --port 8000 --workers 4
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    volumes:
      - ./models:/app/models
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # GPU-enabled services (use gpu-prod target)
  foundation-models:
    build:
      context: .
      dockerfile: Dockerfile.models
      target: gpu-prod
    ports:
      - "8005:8005"
    environment:
      - PYTHONUNBUFFERED=1
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8005 --workers 2
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8005/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    working_dir: /app/models/foundation_models
    volumes:
      - ./models:/app/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  generative-diffusion:
    build:
      context: .
      dockerfile: Dockerfile.models
      target: gpu-prod
    ports:
      - "8008:8008"
    environment:
      - PYTHONUNBUFFERED=1
    command: python -m uvicorn generative_diffusion.main:app --host 0.0.0.0 --port 8008 --workers 2
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8008/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    working_dir: /app/models
    volumes:
      - ./models:/app/models
      - ./data:/app/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # CPU services
  rag-pipeline:
    build:
      context: .
      dockerfile: Dockerfile.models
      target: prod
    ports:
      - "8002:8002"
    environment:
      - PYTHONUNBUFFERED=1
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - PUBMED_API_KEY=${PUBMED_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - INGESTION_API_URL=http://ingestion-service:8011
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8002 --workers 2
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8002/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    working_dir: /app/models/rag_pipeline
    volumes:
      - ./models:/app/models
    depends_on:
      - ingestion-service

  docking:
