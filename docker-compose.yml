      - "8003:8003"
    environment:
      - PYTHONUNBUFFERED=1
      - VINA_PATH=${VINA_PATH:-vina}
      - GNINA_PATH=${GNINA_PATH:-gnina}
      - DIFFDOCK_MODEL_PATH=${DIFFDOCK_MODEL_PATH:-}
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8003 --workers 2
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8003/health || exit 1"]
      interval: 30s
