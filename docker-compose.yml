services:
  affinity-predictor:
    build:
      context: .
      dockerfile: Dockerfile.models
    ports:
      - "8001:8001"
    environment:
      - PYTHONUNBUFFERED=1
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8001
    working_dir: /app/models/affinity_predictor
    volumes:
      - ./models:/app/models

  molecule-generator:
    build:
      context: .
      dockerfile: Dockerfile.models
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8000
    working_dir: /app/models/generative
    volumes:
      - ./models:/app/models
    depends_on:
      - affinity-predictor

  rag-pipeline:
    build:
      context: .
      dockerfile: Dockerfile.models
    ports:
      - "8002:8002"
    environment:
      - PYTHONUNBUFFERED=1
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - PUBMED_API_KEY=${PUBMED_API_KEY:-}
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8002
    working_dir: /app/models/rag_pipeline
    volumes:
      - ./models:/app/models

  docking:
    build:
      context: .
      dockerfile: Dockerfile.models
    ports:
      - "8003:8003"
    environment:
      - PYTHONUNBUFFERED=1
      - VINA_PATH=${VINA_PATH:-vina}
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8003
    working_dir: /app/models/docking
    volumes:
      - ./models:/app/models

  proteochem:
    build:
      context: .
