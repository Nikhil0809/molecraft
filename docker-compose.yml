      - CHROMA_HOST=${CHROMA_HOST:-api.trychroma.com}
      - CHROMA_TENANT=${CHROMA_TENANT:-6ad925cb-038a-4521-9232-58abdf13c5f5}
      - CHROMA_DATABASE=${CHROMA_DATABASE:-molecraft}
      - CHROMA_COLLECTION=${CHROMA_COLLECTION:-molecraft}
      - CHROMA_API_KEY=${CHROMA_API_KEY:-}
    command: python -m uvicorn main:app --host 0.0.0.0 --port 8011 --workers 2
    healthcheck:
